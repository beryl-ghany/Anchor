<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Anchor</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900&family=Cabinet+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0e0c0a;
      --surface: #1c1814;
      --border: rgba(255,235,200,0.12);
      --text: #f5ede0;
      --text-muted: #8a7d6e;
      --gold: #e8a832;
      --gold2: #f5c860;
      --error: #f08080;
    }
    body {
      font-family: 'Cabinet Grotesk', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }
    .wrap { width: 100%; max-width: 420px; }
    .brand {
      font-family: 'Fraunces', serif;
      font-weight: 900;
      font-size: 1.75rem;
      text-align: center;
      margin-bottom: 0.5rem;
    }
    .brand span { color: var(--gold); }
    .sub {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem 1.75rem;
    }
    form label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }
    form .field { margin-bottom: 1.15rem; }
    form input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #12100e;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
    }
    form input:focus {
      outline: 2px solid rgba(232,168,50,0.35);
      outline-offset: 1px;
    }
    .form-error {
      display: none;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      background: rgba(240,128,128,0.12);
      border: 1px solid rgba(240,128,128,0.35);
      color: #ffc4c4;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    .form-error.show { display: block; }
    button[type="submit"] {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.9rem 1.25rem;
      border: none;
      border-radius: 100px;
      background: var(--gold);
      color: #0e0c0a;
      font-family: inherit;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
    button[type="submit"]:hover:not(:disabled) { background: var(--gold2); }
    button[type="submit"]:disabled { opacity: 0.55; cursor: not-allowed; }
    .links {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .links a { color: var(--gold); text-decoration: none; }
    .links a:hover { text-decoration: underline; }
    .back { text-align: center; margin-top: 1rem; }
    .back a { color: var(--text-muted); font-size: 0.9rem; text-decoration: none; }
  </style>
</head>
<body>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      if (q.get("skip_test") === "1" || q.get("testBypass") === "1") {
        localStorage.setItem(
          "anchor_auth",
          JSON.stringify({
            access_token: "anchor-test-bypass",
            expires_at: Date.now() + 365 * 86400000,
            bypass: true
          })
        );
        localStorage.setItem("anchor_name", "Test User");
        localStorage.setItem("anchor_email", "test@anchor.local");
        location.replace("/dashboard.html");
      }
    })();
  </script>
  <a class="skip-to-main" href="#login-main">Skip to main content</a>
  <div class="wrap" id="login-main" tabindex="-1">
    <p class="brand">Anchor<span>.</span></p>
    <p class="sub">Log in with your email and password.</p>

    <div class="card">
      <div id="formError" class="form-error" role="alert" aria-live="assertive"></div>

      <form id="loginForm" data-testid="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required
            data-testid="login-email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required
            data-testid="login-password" />
        </div>
        <button type="submit" data-testid="login-submit">Log in</button>
      </form>
    </div>

    <p class="links">No account yet? <a href="/signup.html">Create one</a></p>
    <p class="back"><a href="/landing.html">← Back to home</a></p>
  </div>

  <script>
    function persistSession(data) {
      const expiresIn = typeof data.expires_in === "number" ? data.expires_in : 3600;
      const expiresAt = Date.now() + expiresIn * 1000;
      localStorage.setItem(
        "anchor_auth",
        JSON.stringify({
          access_token: data.access_token,
          id_token: data.id_token || null,
          expires_at: expiresAt
        })
      );
    }

    (function prefill() {
      const q = new URLSearchParams(window.location.search);
      const email = q.get("email");
      if (email) document.getElementById("email").value = email;
    })();

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const formError = document.getElementById("formError");
      const btn = e.target.querySelector('button[type="submit"]');
      formError.classList.remove("show");
      formError.textContent = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        formError.textContent = "Enter a valid email address.";
        formError.classList.add("show");
        return;
      }
      if (!password) {
        formError.textContent = "Password is required.";
        formError.classList.add("show");
        return;
      }

      btn.disabled = true;
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          formError.textContent = data.error || "Could not log in.";
          formError.classList.add("show");
          btn.disabled = false;
          return;
        }
        persistSession(data);
        const q = new URLSearchParams(window.location.search);
        const ret = q.get("return");
        const safe =
          ret && ret.startsWith("/") && !ret.startsWith("//") ? ret : "/dashboard.html";
        window.location.href = safe;
      } catch (err) {
        formError.textContent = err.message || "Network error.";
        formError.classList.add("show");
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
